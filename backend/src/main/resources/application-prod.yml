spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:jumpstart}?sslMode=REQUIRED&serverTimezone=UTC&connectTimeout=10000}}
    username: ${DB_USERNAME:${POSTGRES_USER:jumpstart}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:jumpstart}}
  jpa:
    show-sql: false

server:
  port: ${PORT:8080}
  error:
    include-message: on-param
    include-stacktrace: NEVER

jumpstart:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

logging:
  level:
    root: INFO
    com.jumpstart: INFO
    org.springframework.web: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
      group:
        liveness:
          include: ping
        readiness:
          include: db
